name: Build Latest GP APK

run-name: Build latest GP Android APKs

on:
  workflow_dispatch:
  push:
    branches:
      - GP
    paths:
      - 'shared/src/**'
      - 'app/src/**'
      - 'gradle.properties'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/android-latest-gp.yml'

# Every run checks out the newest commit on GP.
concurrency:
  group: build-latest-gp-apk
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build latest GP Android APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout latest GP source
        uses: actions/checkout@v7
        with:
          ref: GP
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Use the same Google-hosted Maven Central mirror as the main GP validation workflow.
      - name: Configure Google-hosted Maven Central mirror
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/zx-maven-central-mirror.init.gradle" <<'EOF'
          import org.gradle.api.artifacts.repositories.MavenArtifactRepository

          def replaceRetiredComposeRepo = { repository ->
              if (repository instanceof MavenArtifactRepository &&
                  repository.url.toString().contains("maven.pkg.jetbrains.space/public/p/compose/dev")) {
                  repository.setUrl(uri("https://packages.jetbrains.team/maven/p/cmp/dev"))
              }
          }

          def installCentralMirror = { repositories ->
              repositories.all { repository -> replaceRetiredComposeRepo(repository) }

              def centralRepositories = repositories.findAll { repository ->
                  repository instanceof MavenArtifactRepository &&
                      (repository.url.toString().contains("repo.maven.apache.org/maven2") ||
                       repository.url.toString().contains("repo1.maven.org/maven2"))
              }

              centralRepositories.each { repositories.remove(it) }

              repositories.maven {
                  name = "GoogleCloudMavenCentralMirror"
                  url = uri("https://maven-central.storage-download.googleapis.com/maven2/")
              }
              repositories.mavenCentral()
          }

          gradle.settingsEvaluated { settings ->
              installCentralMirror(settings.dependencyResolutionManagement.repositories)
              installCentralMirror(settings.pluginManagement.repositories)
          }

          gradle.beforeProject { project ->
              project.repositories.all { repository -> replaceRetiredComposeRepo(repository) }
              project.repositories.whenObjectAdded { repository -> replaceRetiredComposeRepo(repository) }
          }
          EOF


      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install Rust Android targets and cargo-ndk
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Build merged QW/Cluvex Aether native engine
        run: bash ./tools/build-aether-engine.sh

      - name: Download and verify Android engines
        run: ./tools/get-cores.sh android

      - name: Run Android unit tests
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if ./gradlew --no-daemon --no-configuration-cache --warning-mode all --init-script "$RUNNER_TEMP/zx-maven-central-mirror.init.gradle" :app:testDebugUnitTest; then exit 0; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            echo "Gradle dependency resolution/build failed; retrying in 30 seconds (attempt $attempt/4)"
            sleep 30
          done

      - name: Build debug APKs
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if ./gradlew --no-daemon --no-configuration-cache --warning-mode all --init-script "$RUNNER_TEMP/zx-maven-central-mirror.init.gradle" :app:assembleDebug; then exit 0; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            echo "Gradle dependency resolution/build failed; retrying in 30 seconds (attempt $attempt/4)"
            sleep 30
          done

      - name: Prepare and verify APK files
        shell: bash
        run: |
          set -euo pipefail
          V=$(grep '^zedsecure.versionName=' gradle.properties | cut -d= -f2)
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src=$(find app/build/outputs/apk/debug -type f -name "*${abi}*debug*.apk" -print -quit)
            [ -n "$src" ] || { echo "::error::Debug APK for $abi was not produced"; find app/build/outputs/apk/debug -type f -print; exit 1; }
            cp "$src" "dist/ZX-VPN-$V-GP-debug-$abi.apk"
          done
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for apk in dist/*.apk; do
            "$BT/apksigner" verify "$apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh dist

      - name: Upload latest GP APKs
        uses: actions/upload-artifact@v7
        with:
          name: ZX-VPN-GP-Latest-Android
          path: dist/*
          if-no-files-found: error
          retention-days: 14
