name: Build Latest GP APK

run-name: Build latest GP Android APKs

on:
  workflow_dispatch:

# This workflow is intentionally manual. It always checks out the newest commit
# on GP, regardless of which branch was selected in the Actions UI.
concurrency:
  group: build-latest-gp-apk
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build latest GP Android APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout latest GP source
        uses: actions/checkout@v7
        with:
          ref: GP
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install Rust Android targets and cargo-ndk
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Build merged QW/Cluvex Aether native engine
        run: bash ./tools/build-aether-engine.sh

      - name: Download and verify Android engines
        run: ./tools/get-cores.sh android

      - name: Run Android unit tests
        run: ./gradlew --no-daemon --warning-mode all :app:testDebugUnitTest

      - name: Build debug APKs
        run: ./gradlew --no-daemon --warning-mode all :app:assembleDebug

      - name: Prepare and verify APK files
        shell: bash
        run: |
          set -euo pipefail
          V=$(grep '^zedsecure.versionName=' gradle.properties | cut -d= -f2)
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src=$(find app/build/outputs/apk/debug -type f -name "*${abi}*debug*.apk" -print -quit)
            [ -n "$src" ] || { echo "::error::Debug APK for $abi was not produced"; find app/build/outputs/apk/debug -type f -print; exit 1; }
            cp "$src" "dist/ZX-VPN-$V-GP-debug-$abi.apk"
          done
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for apk in dist/*.apk; do
            "$BT/apksigner" verify "$apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh dist

      - name: Upload latest GP APKs
        uses: actions/upload-artifact@v7
        with:
          name: ZX-VPN-GP-Latest-Android
          path: dist/*
          if-no-files-found: error
          retention-days: 14
