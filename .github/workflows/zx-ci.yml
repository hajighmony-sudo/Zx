name: ZX CI · GP Validation

on:
  push:
    branches: [GP]
    paths:
      - ".github/workflows/zx-ci.yml"
      - ".github/workflows/**"
      - "app/**"
      - "shared/**"
      - "gradle/**"
      - "gradle.properties"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradlew"
      - "gradlew.bat"
      - "tools/**"
      - ".gitmodules"
      - "native/aether"
      - "native/aether-qw"
      - "native/aether-qw/**"
  pull_request:
    branches: [GP]
    paths:
      - ".github/workflows/**"
      - "app/**"
      - "shared/**"
      - "gradle/**"
      - "gradle.properties"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradlew"
      - "gradlew.bat"
      - "tools/**"
      - ".gitmodules"
      - "native/aether"
      - "native/aether-qw"
      - "native/aether-qw/**"
  workflow_dispatch:

# This workflow has its own concurrency group and never cancels the existing GP pipelines.
concurrency:
  group: zx-ci-gp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Validate GP and build Android debug APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install Rust Android targets and cargo-ndk
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Build merged QW/Cluvex Aether native engine
        run: bash ./tools/build-aether-engine.sh

      - name: Download and verify Android engines
        run: ./tools/get-cores.sh android

      - name: Run Android unit tests
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if ./gradlew --no-daemon --no-configuration-cache --warning-mode all :app:testDebugUnitTest; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "::error::Android unit tests failed after 4 attempts."
              exit 1
            fi
            echo "Gradle test failed; retrying in 30 seconds (attempt $attempt/4)."
            sleep 30
          done

      - name: Build Android debug APKs
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if ./gradlew --no-daemon --no-configuration-cache --warning-mode all :app:assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "::error::Android debug APK build failed after 4 attempts."
              exit 1
            fi
            echo "Gradle APK build failed; retrying in 30 seconds (attempt $attempt/4)."
            sleep 30
          done

      - name: Verify and collect APKs
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep '^zedsecure.versionName=' gradle.properties | cut -d= -f2)"
          mkdir -p dist

          for abi in arm64-v8a armeabi-v7a x86_64; do
            apk="$(find app/build/outputs/apk/debug -type f -name "*${abi}*debug*.apk" -print -quit)"
            if [ -z "$apk" ]; then
              echo "::error::Debug APK for $abi was not produced."
              find app/build/outputs/apk/debug -type f -print || true
              exit 1
            fi
            cp "$apk" "dist/ZX-VPN-$version-GP-CI-$abi.apk"
          done

          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$build_tools/apksigner"
          for apk in dist/*.apk; do
            "$build_tools/apksigner" verify "$apk"
          done

          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh dist

      - name: Add CI summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ZX CI · GP"
            echo "- Commit: `$GITHUB_SHA`"
            echo "- Branch/ref: `$GITHUB_REF`"
            echo "- Android unit tests and debug APK build are required checks."
            echo "- APK targets: arm64-v8a, armeabi-v7a, x86_64."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified Android debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: ZX-GP-CI-Android-Debug
          path: dist/*
          if-no-files-found: error
          retention-days: 14
